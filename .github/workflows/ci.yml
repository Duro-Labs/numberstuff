name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate GTM spec
        run: npm run gtm:validate
      - name: GTM diff logic
        run: npm run test:gtm
      - name: Start WordPress
        run: npx wp-env start
      - name: Composer install
        run: bin/wpenv-composer install --no-interaction
      - name: Lint
        run: bin/phpcs
      - name: Unit tests
        run: bin/phpunit
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npx playwright test
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
